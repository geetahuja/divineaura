# DivineAura backups — the ONE config file (ARCHITECTURE.md §18).
# On the VPS it lives at /etc/divineaura/backup.conf (install.sh copies it there once;
# edit that copy). backup-download.ps1 on Windows reads this file from the repo.
# Plain KEY="value" lines only — read by bash and by PowerShell. No secrets here.

# ── Database ──
# Passed to pg_dump/pg_restore -d: a database name (local socket) or a full postgres:// URI.
DB_NAME="divineaura"
# Linux user that runs pg_dump/pg_restore (peer login to local Postgres). Empty = current user.
DB_RUN_AS="postgres"
# Extra pg_restore flags. VPS: empty (keeps table owners). Restoring into a different
# server/user: "--no-owner --no-acl".
PG_RESTORE_EXTRA=""

# ── Files ──
UPLOADS_DIR="/var/www/divineaura/uploads"
BACKUP_DIR="/var/backups/divineaura"
# Group allowed to READ backups (the SSH user that downloads them is added to it).
BACKUP_GROUP="divineaura-backup"
LOG_FILE="/var/log/divineaura-backup.log"
# Small JSON (date, sizes, status — no secrets) read by the backend for alerts + admin widget.
# Must match BACKUP_STATUS_FILE in apps/backend/.env.
STATUS_FILE="/var/lib/divineaura-backup/status.json"
KEEP_DAYS="14"

# ── Schedule (systemd timer; install.sh writes it — re-run install.sh after changing) ──
BACKUP_TIME="02:30"
BACKUP_TIMEZONE="Asia/Kolkata"

# ── Secrets backup (secrets-backup.sh) — space-separated list of .env files ──
ENV_FILES="/var/www/divineaura/app/apps/backend/.env /var/www/divineaura/app/apps/storefront/.env"

# ── Windows PC copy (backup-download.ps1) ──
VPS_HOST="your-vps-ip-or-api.divineaura.com"
VPS_SSH_USER="deploy"
VPS_SSH_PORT="22"
LOCAL_BACKUP_DIR="D:\DivineAura-Backups"
KEEP_WEEKLY="8"
